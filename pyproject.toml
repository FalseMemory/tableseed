[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tableseed"
version = "0.1.0"
description = "Multi-table seed data generator — build consistent test data across related tables"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
db = ["SQLAlchemy>=2.0"]
pandas = ["pandas>=2.2"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
tableseed = "tableseed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
